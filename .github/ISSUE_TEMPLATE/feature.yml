name: Idea
description: A widget, a page change or anything else that would make Patchboard better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, before the solution. "At 2 AM I want to know whether the backup ran" beats "add a backups widget".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: Screenshots, sketches, or how another tool handles it.
