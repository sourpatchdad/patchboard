name: Something is wrong
description: A page shows the wrong thing, an integration fails, or Patchboard won't start.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      placeholder: |
        1. Open Settings, Connections
        2. Set up Sonarr and press Test connection
        3. The test says it can't connect
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings, bottom of the page, or the image tag you pulled.
      placeholder: 1.9.1
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - Docker Compose
        - Unraid
        - TrueNAS
        - Portainer or another manager
        - Node, without Docker
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows, Safari on iPhone (installed as an app)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker logs patchboard`. Remove addresses and keys first."
      render: text
