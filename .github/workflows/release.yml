name: Release

# A version tag publishes a release. v1.27.0 pushes the image for amd64 and
# arm64 as 1.27.0, 1.27, 1 and latest, the slim image as 1.27.0-slim,
# 1.27-slim, 1-slim and latest-slim, and opens a GitHub Release with that
# version's CHANGELOG section. A pre-release tag (v1.27.0-rc.1) pushes only
# its own tag and never moves latest. docs/RELEASING.md has the steps.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Validate version and release notes before publishing
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.ts "$TAG"

  image:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The slim image: no Docker CLI. onlatest=true matters: without it the
      # suffix skips `latest`, and the slim build would overwrite it.
      - id: meta-slim
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=-slim,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notes:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          node scripts/release-check.ts "$TAG" notes.md
          pre=""
          case "${v%%+*}" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag $pre
