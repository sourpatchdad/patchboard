name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      - run: npm run i18n:check
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/check-home.mjs
      - run: node scripts/check-accessibility.mjs
      - run: node scripts/check-zoom.mjs

  # Code that changes without a CHANGELOG entry fails: the docs move with it.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: CHANGELOG updated with code
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then BASE=$(git rev-parse HEAD~1); fi
          changed=$(git diff --name-only "$BASE" HEAD)
          code=$(echo "$changed" | grep -E '^(server|shared|web|scripts)/' | grep -v '^server/test/' || true)
          if [ -n "$code" ] && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "Code changed without a CHANGELOG.md entry:"
            echo "$code"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The whole history, every time, so a key committed and later deleted
      # still fails the build. The CLI rather than gitleaks-action, which
      # crashes scanning a range that starts at the first commit.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3             git /repo --redact --verbose --exit-code 1

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
