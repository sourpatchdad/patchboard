name: Edge

# Unreleased images, for testing before a release. A push to dev publishes
# :dev (and dev-<sha>); a push to main publishes :edge (and edge-<sha>).
# latest only moves on a version tag (release.yml).

on:
  push:
    branches: [main, dev]
    paths-ignore: ['**.md', 'docs/**', 'examples/**']

permissions:
  contents: read
  packages: write

concurrency:
  group: edge-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name == 'main' && 'edge' || 'dev' }}
            type=sha,prefix=${{ github.ref_name == 'main' && 'edge' || 'dev' }}-
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
