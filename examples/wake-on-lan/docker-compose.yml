# Wake-on-LAN needs the host's network to reach your LAN.
# Add your machines in Settings, Connections, Wake-on-LAN.

services:
  patchboard:
    image: ghcr.io/sourpatchdad/patchboard:latest
    container_name: patchboard
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/New_York
      - LISTEN_HOST=192.168.1.10 # this machine's LAN address
      - PORT=3200
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
