groups:
  - name: Watch & listen
    services:
      - name: Plex
        href: http://plex.example.lan
        icon: plex.png
        container: plex
      - name: Audiobookshelf
        href: http://audiobooks.example.lan
        icon: audiobookshelf.png
        container: audiobookshelf

  - name: Acquire
    services:
      - name: Sonarr
        href: http://100.64.0.1:8989
        icon: sonarr.png
        container: sonarr
      - name: Recyclarr
        icon: recyclarr.png
        container: recyclarr
        expectStopped: true

dock:
  - name: Mail
    href: https://app.fastmail.com/
    icon: fastmail.png
  - name: GitHub
    href: https://github.com/
    icon: github.png
