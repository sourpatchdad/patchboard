# Copy next to a .env made from env.example, then run: docker compose up -d
# Other setups (every optional mount, a hardened install, labels): the folders here.

services:
  patchboard:
    image: ghcr.io/sourpatchdad/patchboard:latest
    container_name: patchboard
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3200:3200"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/config:ro
      - ./data:/data
