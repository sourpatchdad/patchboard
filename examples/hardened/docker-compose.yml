# Patchboard that can look but not touch. It reaches Docker through a socket
# proxy that allows reads only, refuses every change including board edits
# (READ_ONLY), and listens on 127.0.0.1 for a reverse proxy that signs people
# in (AUTH=forward in .env). SECURITY.md explains each choice.

services:
  patchboard:
    image: ghcr.io/sourpatchdad/patchboard:latest
    container_name: patchboard
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ:-UTC}
      - DOCKER_HOST=tcp://socket-proxy:2375
      - READ_ONLY=1
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    depends_on:
      - socket-proxy

  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: patchboard-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - EVENTS=1
      - INFO=1
      - NETWORKS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
