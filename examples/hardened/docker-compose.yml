# Patchboard that can look but not touch. It runs as the unprivileged node
# user, reaches Docker through a socket proxy that allows reads only, refuses
# every change including board edits (READ_ONLY), and listens on 127.0.0.1
# for a reverse proxy that signs people in. It can't update containers, so it
# runs the slim image, which leaves out the Docker CLI. SECURITY.md explains
# each choice.

services:
  patchboard:
    image: ghcr.io/sourpatchdad/patchboard:latest-slim
    container_name: patchboard
    restart: unless-stopped
    user: node
    read_only: true
    environment:
      - TZ=America/New_York
      - DOCKER_HOST=tcp://socket-proxy:2375
      - READ_ONLY=1
      # Your proxy signs people in and passes the name in this header.
      - AUTH=forward
      - TRUSTED_USER_HEADER=Remote-User
      - ALLOWED_HOSTS=dash.example.com
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - patchboard-data:/data
    tmpfs:
      - /tmp
    depends_on:
      - socket-proxy

  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: patchboard-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - EVENTS=1
      - INFO=1
      - NETWORKS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  patchboard-data:
