# Every optional mount. Change the paths on the left to yours.
# docs/CONFIGURATION.md, Mounts, says what each one adds.

services:
  patchboard:
    image: ghcr.io/sourpatchdad/patchboard:latest
    container_name: patchboard
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    ports:
      - "3200:3200"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
      - /mnt/tank:/pool:ro # storage use
      - /mnt/tank/notes:/docs:ro # RUNBOOK.md
      - /mnt/tank/logs:/logs:ro # backup logs
      - /mnt/tank/compose:/mnt/tank/compose:ro # updates from the UI: same path as on the host
