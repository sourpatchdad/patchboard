<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Patchboard</title>
    <meta name="description" content="A control center for your home server" />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <script>
      // Paint the saved theme before any bundle loads (mirrors web/lib/appearance.ts).
      (function () {
        var r = document.documentElement, v = null;
        try { v = JSON.parse(localStorage.getItem('pb-vars') || 'null'); } catch (e) {}
        var light = matchMedia('(prefers-color-scheme: light)').matches;
        // The app icon is dark unless this device picked another (Settings, Look).
        // E-ink, or Black and white picked, gets the mono icon, white on black
        // when the phone is in dark mode.
        function icons(choice, scheme) {
          var fixed = choice === 'dark' || choice === 'light' || choice === 'mono', k = fixed ? choice : scheme, q = function (s) { return document.querySelector(s); };
          if (k === 'mono' && !light) k = 'mono-dark';
          q('link[rel="apple-touch-icon"]').href = k.indexOf('mono') === 0 ? '/icon-' + k + '-180.png' : k === 'light' ? '/icon-light-180.png' : '/icon-180.png';
          q('link[rel="manifest"]').href = k.indexOf('mono') === 0 ? '/manifest-' + k + '.webmanifest' : k === 'light' ? '/manifest-light.webmanifest' : '/manifest.webmanifest';
        }
        // An installed iPhone app gets a solid status bar in the mode's color.
        // A translucent one lets iOS blur the page under the clock.
        function statusBar(scheme) {
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = scheme === 'light' ? 'default' : 'black';
        }
        if (!v) { r.dataset.theme = 'graphite'; r.dataset.scheme = light ? 'light' : 'dark'; icons('dark', r.dataset.scheme); statusBar(r.dataset.scheme); return; }
        var scheme = v.scheme === 'auto' ? (light ? 'light' : 'dark') : v.scheme;
        icons(v.eink ? 'mono' : v.appIcon || 'dark', scheme);
        statusBar(v.eink ? 'light' : scheme);
        if (v.eink) document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = '#ffffff'; });
        var vars = v[scheme] || {};
        for (var k in vars) r.style.setProperty(k, vars[k]);
        r.dataset.scheme = scheme;
        for (var a in v.attrs || {}) r.dataset[a] = v.attrs[a];
      })();
    </script>
  </head>
  <body>
    <!-- E-ink's ink for app icons: gray, with the middle tones pushed toward black so pale icons read, white and black left alone. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="eink-ink" color-interpolation-filters="sRGB">
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer>
          <feFuncR type="gamma" exponent="2.4" />
          <feFuncG type="gamma" exponent="2.4" />
          <feFuncB type="gamma" exponent="2.4" />
        </feComponentTransfer>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
