<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Patchboard</title>
    <meta name="description" content="A control center for your home server" />
    <meta name="theme-color" content="#0b0c0e" />
    <script>
      // Paint the saved theme before any bundle loads (mirrors web/lib/appearance.ts).
      (function () {
        var r = document.documentElement, v = null;
        try { v = JSON.parse(localStorage.getItem('pb-vars') || 'null'); } catch (e) {}
        var light = matchMedia('(prefers-color-scheme: light)').matches;
        if (!v) { r.dataset.theme = 'graphite'; r.dataset.scheme = light ? 'light' : 'dark'; return; }
        var scheme = v.scheme === 'auto' ? (light ? 'light' : 'dark') : v.scheme;
        var vars = v[scheme] || {};
        for (var k in vars) r.style.setProperty(k, vars[k]);
        r.dataset.scheme = scheme;
        for (var a in v.attrs || {}) r.dataset[a] = v.attrs[a];
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
