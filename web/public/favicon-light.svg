    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7E2D8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#000" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="9" y="9" width="21.5" height="21.5" rx="5" fill="#2B3442"/>
  <rect x="33.5" y="9" width="21.5" height="21.5" rx="5" fill="#6A92E8"/>
  <rect x="9" y="33.5" width="21.5" height="21.5" rx="5" fill="#F2A947"/>
  <rect x="33.5" y="33.5" width="21.5" height="21.5" rx="5" fill="#2B3442"/>
</svg>
