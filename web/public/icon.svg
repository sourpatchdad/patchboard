<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3442"/>
      <stop offset="1" stop-color="#10141A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#4A5D78" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4A5D78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#E0D8C8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFCD7E"/>
      <stop offset="1" stop-color="#DC8A2B"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CB0F7"/>
      <stop offset="1" stop-color="#3E66C8"/>
    </linearGradient>
    <!-- Light from above: a bright top edge and a darker bottom edge on every patch. -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <rect id="p" width="290" height="290" rx="66"/>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- Four patches sewn into one board: three calm, one lit. -->
  <g filter="url(#drop)">
    <use href="#p" x="212" y="212" fill="url(#cream)"/>
    <use href="#p" x="522" y="212" fill="url(#blue)"/>
    <use href="#p" x="212" y="522" fill="url(#amber)"/>
    <use href="#p" x="522" y="522" fill="url(#cream)"/>
  </g>
  <g fill="url(#bevel)">
    <use href="#p" x="212" y="212"/>
    <use href="#p" x="522" y="212"/>
    <use href="#p" x="212" y="522"/>
    <use href="#p" x="522" y="522"/>
  </g>

  <!-- Stitches across each seam. -->
  <g stroke="#10141A" stroke-opacity="0.6" stroke-width="13" stroke-linecap="round">
    <path d="M490 292 L534 292 M490 357 L534 357 M490 422 L534 422"/>
    <path d="M490 602 L534 602 M490 667 L534 667 M490 732 L534 732"/>
    <path d="M292 490 L292 534 M357 490 L357 534 M422 490 L422 534"/>
    <path d="M602 490 L602 534 M667 490 L667 534 M732 490 L732 534"/>
  </g>
  <!-- Running stitch inside the lit patch. -->
  <rect x="246" y="556" width="222" height="222" rx="42" fill="none" stroke="#8F520F" stroke-opacity="0.55" stroke-width="11" stroke-dasharray="25 17" stroke-linecap="round"/>
</svg>
